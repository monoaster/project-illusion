<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Illusion</title>
<style>
/* Project Illusion Home, run by the launcher (HomeActivity.java) in a WebView. Fixed 1280×720 stage scaled to the screen.
   Fonts are bundled (SIL OFL). */
@font-face{font-family:'Bricolage Grotesque';font-weight:200 800;src:url(fonts/bricolage.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:400 600;src:url(fonts/instrument-sans.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400 700;src:url(fonts/jetbrains-mono.woff2) format('woff2')}
:root{
  color-scheme:dark;
  --ink:#0B0D17; --panel:#13162A; --panel2:#1B1F3A; --line:#2A2F52;
  --fg:#ECEAF7; --dim:#8F93B8; --faint:#5B5F80;
  --focus:#FF6B3D; --measure:#5ED6FF; --ok:#7EF0B0; --warn:#FFC857; --bad:#FF5C7A;
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;font-family:var(--body);background:var(--ink);user-select:none;-webkit-user-select:none}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scr{position:absolute;inset:0;z-index:1}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,23,.92) 0%,rgba(11,13,23,.55) 55%,rgba(11,13,23,.25) 100%),linear-gradient(0deg,rgba(11,13,23,.9) 0%,rgba(11,13,23,0) 45%)}
.dark{position:absolute;inset:0;background:rgba(11,13,23,.86)}

/* topbar (shared across screens) */
.topbar{position:absolute;z-index:4;left:64px;top:24px;display:flex;align-items:center;gap:18px;font-family:var(--mono);font-size:13px;color:var(--dim)}
.topbar .bm{font-family:var(--display);font-weight:700;font-size:18px;color:var(--fg);letter-spacing:-.01em;margin-right:8px}
.topbar .bm i{font-style:normal;color:var(--focus)}
.tabs{display:flex;gap:4px}
.tab{position:relative;font-family:var(--mono);font-size:13px;color:var(--dim);padding:3px 12px;border-radius:999px;border:1px solid transparent}
.tab[aria-current="true"]{color:var(--fg);border-color:var(--line);background:rgba(27,31,58,.8)}
.tab.on{transform:none;color:var(--fg);border-color:var(--focus)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 10px var(--ok)}
.dot.off{background:var(--bad);box-shadow:0 0 10px var(--bad)}

/* focusables */
.f{position:absolute;outline:0;transition:transform .22s cubic-bezier(.2,.9,.2,1.25),border-color .2s,background .2s}
.f.on{transform:translateY(-5px);border-color:var(--focus)!important;background:rgba(27,31,58,.95)}
.f.tab,.f.ico{position:relative}

/* home */
.hello{position:absolute;left:64px;top:96px}
.hello h2{font-family:var(--display);font-weight:300;font-size:76px;line-height:.92;letter-spacing:-.035em;margin:0}
.hello h2 b{font-weight:800}
.bigclock{position:absolute;right:64px;top:50px;text-align:right}
.bigclock .t{font-family:var(--display);font-weight:200;font-size:100px;line-height:.85;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.bigclock .t span{color:var(--focus);font-weight:400}
.bigclock .d{font-family:var(--mono);font-size:17px;line-height:1.2;color:rgba(236,234,247,.75);margin-top:6px}
.bigclock .icons{margin-bottom:8px}
/* weather for the theme's place, on its own line between the time and the date */
.bigclock .wx{display:flex;justify-content:flex-end;align-items:center;gap:9px;margin-top:5px;height:28px}
.bigclock .wx[hidden]{display:none}
.bigclock .wx svg{width:24px;height:24px;flex:none}
.bigclock .wx b{font-family:var(--display);font-weight:300;font-size:28px;line-height:1;letter-spacing:-.03em;color:var(--fg)}
.bigclock .wx span{font-family:var(--mono);font-size:16px;color:rgba(236,234,247,.75)}
.resume{left:64px;top:268px;width:1152px;height:156px;display:flex;border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden;background:rgba(17,20,38,.94);text-align:left}
.resume .poster{position:relative;width:230px;flex:none;background:radial-gradient(circle at 30% 35%,#E5484D 0,#8A1F33 45%,#2A0D19 100%);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;font-family:var(--display);font-weight:800;font-size:46px;line-height:.9;letter-spacing:-.03em}
.resume .poster::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.15) 70%)}
.resume .poster>*{position:relative}
.resume .poster.art{background-size:auto 150%!important;background-position:70% 18%!important}
.resume .poster.art::before{background:linear-gradient(90deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.08) 80%),linear-gradient(0deg,rgba(0,0,0,.6) 0%,transparent 55%)}
.resume .poster small{font-family:var(--mono);font-size:11px;font-weight:400;opacity:.75;letter-spacing:0;margin-bottom:6px}
.resume .body{flex:1;padding:18px 24px;display:flex;flex-direction:column;gap:5px;min-width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--hc,#E5484D) 10%,transparent),transparent 55%)}
.resume .next{width:300px;flex:none;border-left:1px dashed var(--line);padding:18px 22px;display:flex;flex-direction:column;gap:4px;min-width:0}
.resume .next b{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmd{font-family:var(--mono);font-size:12px;color:var(--measure)}
.resume h3{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;letter-spacing:-.02em;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--fg);border-radius:2px}
.icons{display:flex;justify-content:flex-end;gap:10px;margin-bottom:10px}
.ico{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(19,22,42,.7);display:grid;place-items:center;color:var(--dim)}
.ico svg{width:22px;height:22px}
.ico.on{color:var(--fg);transform:translateY(-3px) rotate(0)}
#settings.on svg{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.usbled{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.splash{position:absolute;inset:0;z-index:7;display:grid;place-items:center;transition:clip-path .55s cubic-bezier(.7,0,.2,1),opacity .4s;pointer-events:none}
.splash span{font-family:var(--display);font-weight:800;font-size:120px;letter-spacing:-.05em;color:#fff}
.splash small{position:absolute;bottom:60px;font-family:var(--mono);font-size:14px;color:rgba(255,255,255,.75)}
.splash.out{opacity:0}


/* 12-hour clock */
.bigclock .t small{font-family:var(--mono);font-size:26px;font-weight:400;letter-spacing:0;color:var(--dim);margin-left:10px}

/* Wi-Fi icon carries the state: bars and colour */
#wifi{color:var(--wc,var(--dim))}
#wifi .bar{stroke:var(--wc,currentColor);transition:opacity .3s,stroke .3s}
#wifi .bar.off{opacity:.18}
#wifi .x{display:none;stroke:var(--wc)}
#wifi.offline .x{display:block}
#wifi::after{content:"";position:absolute;inset:-1px;border-radius:50%;box-shadow:0 0 16px -2px var(--wc,transparent);opacity:.55;pointer-events:none}

/* immersive room: the focused app's colour floods Home from the floor up */
#room{position:absolute;inset:0;opacity:0;transition:opacity .7s ease,background .7s ease;pointer-events:none}
#room.lit{opacity:1}
/* the dock: five windows onto one night road (nightdrive.js); the focused app's city fills the room behind */
#dock{position:absolute;left:64px;right:64px;top:470px;height:150px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;perspective:1000px;z-index:2}
.f.win{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#070912;transform-style:preserve-3d;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.2,.9,.2,1.15),border-color .3s,box-shadow .4s;text-align:left}
.win canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.win .glass{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.09),transparent 38%),radial-gradient(46% 24% at 50% 84%,rgba(4,6,14,.5),transparent 100%);pointer-events:none}
.win .wm{position:absolute;left:16px;bottom:14px;right:12px;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.035em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .45s cubic-bezier(.2,1.5,.3,1);text-shadow:0 0 12px rgba(4,6,14,.9),0 1px 3px rgba(4,6,14,.85)}
.f.win:first-child{transform-origin:40% 100%}.f.win:last-child{transform-origin:60% 100%}
/* the end windows lift a little less, so they keep a clear gap to their neighbour and stay at the margin */
.f.win:first-child.on,.f.win:last-child.on{transform:rotateX(4deg) translateY(-8px) scale(1.025)!important}
.f.win.on{border-color:var(--c)!important;background:#070912;transform:rotateX(4deg) translateY(-8px) scale(1.05);box-shadow:0 30px 100px -34px color-mix(in srgb,var(--c) 60%,transparent)}
.f.win.on .wm{transform:translateZ(40px)}
#trackbg,#track{position:absolute;left:0;top:430px;width:1280px;height:300px;z-index:1;pointer-events:none}
.imm{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.imm.on{opacity:1;transform:none}
.imm canvas,.imm .near{position:absolute;left:0;top:0;width:1340px;height:720px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.imm .near i{position:absolute;animation:flk 4s infinite}
@keyframes flk{0%,38%,44%,68%,100%{opacity:1}40%{opacity:.12}42%{opacity:.8}70%{opacity:.25}}

/* new for you: the apps as channels on a week guide, a spotlight with the art blended in */
#nArt{position:absolute;right:0;top:0;width:900px;height:420px;transition:opacity .35s;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 42%),linear-gradient(0deg,transparent 0,#000 34%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0,#000 42%),linear-gradient(0deg,transparent 0,#000 34%);mask-composite:intersect}
#nArtImg{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.nspot{position:absolute;left:64px;top:96px;width:640px;z-index:2}
.kick{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--dim)}
.ntag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.ntag.new{color:var(--ok)}.ntag.pick{color:var(--measure)}
.nspot h2{font-family:var(--display);font-weight:800;font-size:60px;line-height:.95;letter-spacing:-.035em;margin:14px 0 10px;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nmeta{font-family:var(--mono);font-size:13px;color:var(--dim)}
.nspot p{margin:12px 0 0;color:#C9CBE0;font-size:16px;max-width:52ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.why{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.why span{font-family:var(--mono);font-size:12px;color:#C9CBE0;background:rgba(11,13,23,.55);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 11px}
.why span b{font-weight:500;color:var(--fg)}
.guide{position:absolute;left:64px;right:64px;top:404px;height:296px}
.axis{position:absolute;left:156px;right:0;top:0;height:22px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.axis span{position:absolute;top:0}
.now{position:absolute;left:156px;top:0;bottom:0;width:2px;background:var(--focus);box-shadow:0 0 12px var(--focus);z-index:1}
.grow2{position:absolute;left:0;right:0;height:50px;border-top:1px solid rgba(42,47,82,.6)}
.chan{position:absolute;left:0;top:0;width:146px;height:50px;display:flex;flex-direction:column;justify-content:center}
.chan b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan small{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}
.f.prog{top:6px;height:38px;border-radius:9px;border:1px solid var(--line);background:rgba(19,22,42,.92);padding:3px 10px 3px 4px;display:flex;align-items:center;gap:9px;overflow:hidden;text-align:left}
.f.prog.on{transform:translateY(-3px);background:rgba(36,30,52,.98);z-index:2}
.prog.pick{border-style:dashed}
.prog .th{flex:none;width:44px;height:30px;border-radius:5px;background-size:cover;background-position:center}
.prog .tx{min-width:0;display:flex;flex-direction:column}
.prog b{font-family:var(--display);font-weight:600;font-size:13.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog small{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .nd{position:absolute;right:7px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.tab .tdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:2px;box-shadow:0 0 8px var(--ok)}

/* resume wall */
.rhead{position:absolute;left:64px;right:64px;top:74px;display:flex;align-items:flex-end;gap:18px}
.rhead h2{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1;margin:0}
.rhead h2 span{color:var(--focus)}
.rhead .sub{white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--dim);padding-bottom:5px}
.flt{position:relative;top:auto;left:auto;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:rgba(19,22,42,.8)}
.flt[aria-pressed="true"]{color:var(--fg);border-color:var(--measure)}
.flt.on{transform:translateY(-3px)}
.flt b{font-weight:500;color:var(--faint);margin-left:4px}
.fwrap{margin-left:auto;display:flex;gap:6px;padding-bottom:2px;flex-wrap:nowrap}
#wall{position:absolute;left:64px;top:142px;width:1152px;height:556px;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:101px;gap:12px}
.rt{position:relative;display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(19,22,42,.9);text-align:left;min-width:0}
.rt .cv{width:66px;flex:none;display:flex;align-items:flex-end;padding:8px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.04em;line-height:.9;color:rgba(255,255,255,.92);background-size:cover;background-position:center}
.rt .in{flex:1;min-width:0;padding:9px 11px 10px;display:flex;flex-direction:column;gap:2px}
.rt b{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .ap{font-family:var(--mono);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .lf{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap;display:flex;justify-content:space-between;gap:6px}
.rt.old{opacity:.5}
.rt.old .lf span:last-child{color:var(--warn)}
.empty{position:absolute;left:64px;top:160px;font-family:var(--mono);font-size:14px;color:var(--dim)}

/* all apps */
#appgrid{position:absolute;left:64px;top:150px;width:1152px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:118px;gap:14px}
.ag{position:relative;border:1px solid var(--line);border-radius:14px;background:rgba(19,22,42,.9);display:flex;flex-direction:column;justify-content:space-between;padding:12px 14px;text-align:left;overflow:hidden;min-width:0}
.ag .mono{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.03em;color:#0B0D17}
.ag b{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ag small{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ag.on{transform:translateY(-5px) scale(1.03)}
.ag.sys .mono{background:transparent!important;border:1.5px solid var(--line);color:var(--dim)}

/* dial */
#dial{position:absolute;inset:0;z-index:8;background:rgba(3,4,10,.58)}
#dial svg{position:absolute;left:0;top:0;width:1280px;height:720px}
.seg{transition:transform .32s cubic-bezier(.2,.9,.2,1.3),opacity .25s;transform-origin:640px 360px}
#dial.in .seg{transform:scale(.6) rotate(-25deg);opacity:0}
.seg path{fill:rgba(27,31,58,.92);stroke:rgba(255,255,255,.1);stroke-width:1;transition:fill .15s}
.seg text{font-family:var(--mono);font-size:15px;fill:var(--fg);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.seg text.s2{font-size:11px;fill:var(--dim)}
.seg.sel path{fill:var(--focus)}
.seg.sel text{fill:#1A0A03}
#dialSweep{transition:transform .2s cubic-bezier(.2,.9,.2,1.3);transform-origin:640px 360px}
/* dial-only mode: the overlay drawn over other apps (DialService) */
.dialonly,.dialonly body,.dialonly #stage{background:transparent}
.dialonly #bg,.dialonly .scr,.dialonly .topbar{display:none}

/* toasts, glitch */
#toasts{position:absolute;right:28px;bottom:28px;z-index:10;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{font-family:var(--mono);font-size:13px;background:rgba(10,12,22,.94);border:1px solid var(--line);border-left:3px solid var(--focus);padding:9px 14px;font-family:var(--body);font-size:14px;border-radius:6px;max-width:620px;animation:tin .28s cubic-bezier(.2,.9,.2,1.2)}
.toast b{font-weight:600;color:var(--fg)}
.toast.out{transition:opacity .3s,transform .3s;opacity:0;transform:translateX(30px)}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
.glitch .scr:not([hidden]){animation:gl .34s steps(3) 1}
@keyframes gl{
 0%{clip-path:inset(12% 0 64% 0);transform:translateX(-18px);filter:hue-rotate(80deg)}
 33%{clip-path:inset(58% 0 8% 0);transform:translateX(14px);filter:hue-rotate(-60deg) saturate(2)}
 66%{clip-path:inset(30% 0 40% 0);transform:translateX(-6px)}
 100%{clip-path:inset(0 0 0 0);transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.glitch .scr:not([hidden]){animation:none}.f,.seg{transition:none}}
</style></head>
<body>
<div id="stage">
  <canvas id="bg" width="640" height="360"></canvas>

  <div class="topbar">
    <span class="bm">project<i>_</i>illusion</span>
    <nav class="tabs">
      <button class="f tab" id="tab-home" data-f data-act="go" data-v="home" data-accent="#ECEAF7" aria-current="true" tabindex="-1">home</button>
      <button class="f tab" id="tab-resume" data-f data-act="go" data-v="resume" data-accent="#5ED6FF" tabindex="-1">continue watching</button>
      <button class="f tab" id="tab-new" data-f data-act="go" data-v="new" data-accent="#7EF0B0" tabindex="-1">new for you<i class="tdot" id="newDot" hidden></i></button>
    </nav>
  </div>

  <!-- HOME -->
  <section class="scr" id="s-home">
    <div class="shade"></div>
    <div class="imm" id="immA"><canvas></canvas><canvas></canvas><canvas></canvas><div class="near"></div></div>
    <div class="imm" id="immB"><canvas></canvas><canvas></canvas><canvas></canvas><div class="near"></div></div>
    <div id="room"></div>
    <div class="hello"><h2 id="hello">Good evening,<br><b>Alex.</b></h2></div>
    <div class="bigclock"><div class="icons">

<script src="nightdrive.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const stage=$('#stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DIAL_ONLY=location.hash==='#dial';
if(DIAL_ONLY) document.documentElement.classList.add('dialonly');
let S=1;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- the launcher (HomeActivity.java); a stand-in when the page runs in a browser ---------- */
const CK=window.CK||{
  // in a browser, #apps=3 (or 4) trims the sample dock and #nobrand hides the project_illusion name
  home:()=>JSON.stringify({name:'Alex',brand:!/nobrand/.test(location.hash),dock:[
    {pkg:'com.netflix.ninja',label:'Netflix',color:'#E50914'},{pkg:'com.amazon.amazonvideo.livingroom',label:'Prime Video',color:'#1FA2F1'},
    {pkg:'com.google.android.youtube.tv',label:'YouTube',color:'#FF3B30'},{pkg:'in.startv.hotstar',label:'JioHotstar',color:'#3D7BFF'},
    {pkg:'com.crunchyroll.crunchyroid',label:'Crunchyroll',color:'#F47521'}].slice(0,+((/apps=(\d)/.exec(location.hash)||[])[1])||5),weather:{lat:16.3067,lon:80.4365,f:false}}),
  shows:()=>JSON.stringify([{key:'k1',pkg:'com.netflix.ninja',app:'Netflix',color:'#E50914',title:'Rick and Morty',season:'3',episode:'10',position:997000,duration:1366000,time:Date.now()-3600e3,poster:''},
    {key:'k2',pkg:'com.amazon.amazonvideo.livingroom',app:'Prime Video',color:'#1FA2F1',title:'Jathi Ratnalu',season:'',episode:'',position:6721000,duration:8607000,time:Date.now()-7200e3,poster:''}]),
  apps:()=>JSON.stringify([{pkg:'com.netflix.ninja',label:'Netflix',color:'#E50914',sys:false},{pkg:'com.android.vending',label:'Google Play Store',color:'#34A853',sys:false}]),
  status:()=>JSON.stringify({net:'Wi-Fi · good',online:true,usb:null}),
  open:p=>console.log('open',p), resume:k=>console.log('resume',k), remove:k=>console.log('remove',k),
  wifi:()=>{}, settings:()=>{}, usb:()=>{}, inputs:()=>{}, sleep:m=>{}, dialDone:()=>{}
};
const parse=(f,d)=>{try{const v=JSON.parse(f()); return v==null?d:v;}catch(e){console.error('bridge: '+e); return d}};

/* ---------- apps: which of the tuned five, and their wordmarks ---------- */
const APP_ID={'com.netflix.ninja':'netflix','com.amazon.amazonvideo.livingroom':'prime','com.google.android.youtube.tv':'youtube','in.startv.hotstar':'hotstar','com.crunchyroll.crunchyroid':'crunchyroll'};
const WORDMARK={netflix:'NETFLIX',prime:'prime video',youtube:'YouTube',hotstar:'JioHotstar',crunchyroll:'crunchyroll'};
const appKey=pkg=>APP_ID[pkg]||'other';
const appShort=a=>({netflix:'netflix',prime:'prime video',youtube:'youtube',hotstar:'jiohotstar',crunchyroll:'crunchyroll'}[appKey(a.pkg)]||String(a.app||'').toLowerCase());
const hueOf=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h;};
const initials=t=>{const w=String(t).replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean);const k=w.filter(x=>(x.length>2&&x!=='The')||w.length===1);return (k.length?k:w).slice(0,2).map(x=>x[0].toUpperCase()).join('')||String(t)[0]||'?';};
const cover=h=>`radial-gradient(circle at 30% 25%,hsl(${h} 75% 58%) 0,hsl(${h} 60% 32%) 55%,hsl(${h} 50% 14%) 100%)`;
const mmss=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;};
const minsLeft=s=>s.duration>s.position?Math.ceil((s.duration-s.position)/60000):0;
const epOf=s=>s.season&&s.episode?`S${s.season} E${s.episode}`:s.episode?`E${s.episode}`:'';
const agoOf=t=>{const d=Math.floor((Date.now()-t)/864e5);if(Date.now()-t<36e5*20&&new Date(t).getDate()===new Date().getDate())return 'today '+hm(t);return d<=1?'yesterday '+hm(t):d<7?['sun','mon','tue','wed','thu','fri','sat'][new Date(t).getDay()]+' '+hm(t):d+'d ago';};
const hm=t=>{const d=new Date(t), h=d.getHours()%12||12;return h+':'+String(d.getMinutes()).padStart(2,'0')+' '+(d.getHours()<12?'am':'pm');};

/* ---------- state ---------- */
let HOME={name:'',dock:[]}, SHOWS=[], APPLIST=[], filter='all';

function renderHome(){
  HOME=parse(()=>CK.home(),{name:'',dock:[]});
  const h=new Date().getHours(), part=h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':h<22?'Good evening':'Good night';
  $('.topbar .bm').hidden=HOME.brand===false;
  $('#hello').innerHTML=HOME.name?`${part},<br><b>${esc(HOME.name)}.</b>`:`${part}<b>.</b>`;
  const dockKey=HOME.dock.map(a=>a.pkg+a.color).join();
  if(dockKey!==renderHome.k){ renderHome.k=dockKey;
    $('#dock').style.gridTemplateColumns=`repeat(${Math.max(1,Math.min(5,HOME.dock.length))},1fr)`;   // the windows share the dock's width
    $('#dock').innerHTML=HOME.dock.slice(0,5).map((a,i)=>{const id=appKey(a.pkg), c=a.color||'#5ED6FF';
      return `<button class="f win" id="d-${i}" data-f data-act="app" data-pkg="${esc(a.pkg)}" data-name="${esc(WORDMARK[id]||a.label)}" data-accent="${c}" tabindex="-1" style="--c:${c};--ry:${(i-2)*-5}deg"><canvas></canvas><div class="glass"></div><span class="wm" style="color:${id==='netflix'?c:'#fff'}">${esc(WORDMARK[id]||a.label)}</span></button>`;}).join('');
    setTimeout(startDrive,60); }
}
function renderShows(){
  SHOWS=parse(()=>CK.shows(),[]);
  const s=SHOWS[0], n=SHOWS[1];
  const P=$('#hPoster');
  if(s){
    P.style.background=s.poster?`url("${s.poster}") center/cover`:cover(hueOf(s.title)); P.classList.toggle('art',!!s.poster);
    $('#resume').style.setProperty('--hc',s.color||'#E5484D');
    $('#hApp').textContent=appShort(s); $('#hEp').innerHTML=epOf(s)?esc(epOf(s)).replace(' ','<br>'):esc(initials(s.title));
    $('#hTitle').textContent=s.title;
    const bits=[]; if(s.position>0)bits.push('paused at '+mmss(s.position)); if(minsLeft(s))bits.push(minsLeft(s)+'m left'); bits.push('last watched '+agoOf(s.time));
    $('#hMeta').textContent=bits.join(' · ');
    $('#hBar').style.width=(s.duration?Math.min(100,s.position/s.duration*100):3)+'%'; $('#hBar').style.background=s.color||'var(--fg)';
    $('#resume').dataset.accent=s.color||'#E5484D'; $('#resume').dataset.key=s.key;
  } else {
    P.style.background=cover(220); P.classList.remove('art'); $('#hApp').textContent=''; $('#hEp').textContent='—';
    $('#hTitle').textContent='Nothing in progress'; $('#hMeta').textContent='start something from the dock below'; $('#hBar').style.width='0%'; $('#resume').dataset.key='';
  }
  if(n){ $('#nTitle').textContent=n.title+(epOf(n)?' · '+epOf(n):''); $('#nMeta').textContent=[appShort(n),minsLeft(n)?minsLeft(n)+'m left':''].filter(Boolean).join(' · '); }
  else { $('#nTitle').textContent='—'; $('#nMeta').textContent='nothing else unfinished'; }
  renderWall();
}
function renderWall(){
  const apps=[...new Set(SHOWS.map(appKey2))].slice(0,5);
  if(filter!=='all'&&!apps.includes(filter)) filter='all';
  $('#filters').innerHTML=['all',...apps].map(f=>{const s=SHOWS.find(x=>appKey2(x)===f);
    return `<button class="f flt" id="flt-${esc(f)}" data-f data-act="filter" data-v="${esc(f)}" data-accent="${f==='all'?'#5ED6FF':(s&&s.color)||'#5ED6FF'}" aria-pressed="${f===filter}" tabindex="-1">${f==='all'?'all':esc(appShort(s))}<b>${f==='all'?SHOWS.length:SHOWS.filter(x=>appKey2(x)===f).length}</b></button>`;}).join('');
  const list=SHOWS.map((s,i)=>[s,i]).filter(([s])=>filter==='all'||appKey2(s)===filter);
  $('#rSub').textContent=`${list.length} unfinished · hold OK to remove`;
  $('#wallEmpty').hidden=SHOWS.length>0;
  $('#wall').innerHTML=list.map(([s,i])=>{const days=Math.floor((Date.now()-s.time)/864e5), old=days>30;
    const cv=s.poster?`background-image:url('${s.poster}')`:`background:${cover(hueOf(s.title))}`;
    return `<button class="f rt${old?' old':''}" id="r${i}" data-f data-act="show" data-i="${i}" data-accent="${s.color||'#5ED6FF'}" tabindex="-1">
 <span class="cv" style="${cv}">${s.poster?'':esc(initials(s.title))}</span>
 <span class="in"><b>${esc(s.title)}</b><span class="ap" style="color:${s.color||'var(--dim)'}">${esc(appShort(s))}${epOf(s)?' · '+epOf(s):''}</span>
 <span class="lf"><span>${minsLeft(s)?minsLeft(s)+' min left':'up next'}</span><span>${old?'idle '+days+'d':esc(agoOf(s.time).replace(/ \d\d:\d\d$/,''))}</span></span>
 <span class="bar"><i style="width:${s.duration?Math.min(100,s.position/s.duration*100):3}%;background:${s.color||'var(--fg)'}"></i></span></span></button>`;}).join('');
}
const appKey2=s=>s.pkg;
function renderApps(){
  APPLIST=parse(()=>CK.apps(),[]);
  $('#agSub').textContent=`${APPLIST.length} apps on this TV`;
  $('#appgrid').innerHTML=APPLIST.slice(0,24).map((a,i)=>{const g=a.label.length<=4?a.label:initials(a.label);
    return `<button class="f ag${a.sys?' sys':''}" id="ag${i}" data-f data-act="openapp" data-i="${i}" data-accent="${a.color}" tabindex="-1"><span class="mono" style="background:${a.color}">${esc(g)}</span><span><b>${esc(a.label)}</b><small>${a.sys?'system':''}</small></span></button>`;}).join('');
}


/* ---------- status ---------- */
function renderStatus(){const st=parse(()=>CK.status(),{});
  const Q={excellent:['#7EF0B0',4],good:['#7EF0B0',3],wired:['#7EF0B0',4],fair:['#FFC857',2],weak:['#FF5C7A',1],offline:['#FF5C7A',0]}, q=Q[st.quality]||(st.online?Q.good:Q.offline);
  const w=$('#wifi'); w.style.setProperty('--wc',q[0]); w.querySelectorAll('.bar').forEach((b,i)=>b.classList.toggle('off',i>=q[1])); w.classList.toggle('offline',q[1]===0);
  w.setAttribute('aria-label','Wi-Fi '+(st.quality||(st.online?'on':'offline'))+', open Wi-Fi settings');
  $('#usbled').hidden=!st.usb; $('#usb').dataset.label=st.usb?st.usb.name:'';}

/* ---------- stage scaling ---------- */
function fit(){const W=document.documentElement.clientWidth||innerWidth, H=document.documentElement.clientHeight||innerHeight; S=Math.min(W/1280,H/720); stage.style.transform=`scale(${S})`;
  stage.style.left=((W-1280*S)/2)+'px'; stage.style.top=((H-720*S)/2)+'px';;}
addEventListener('resize',fit);

/* ---------- focus engine ---------- */
const SCREENS=['home','resume','new','apps'];
let screen='home', cur=null, overlay=null;
const mem={home:'resume'};
function rectOf(el){let x=0,y=0,n=el;while(n&&n!==stage){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent;}return{x,y,w:el.offsetWidth,h:el.offsetHeight};}
function list(){return [...$$('.topbar [data-f]'),...$$(`#s-${screen} [data-f]`)].filter(e=>!e.hidden&&e.offsetParent!==null);}
const ox=(a,b)=>Math.max(0,b.x-(a.x+a.w),a.x-(b.x+b.w)), oy=(a,b)=>Math.max(0,b.y-(a.y+a.h),a.y-(b.y+b.h));
function neighbor(from,dir,els){
  const a=rectOf(from), ac={x:a.x+a.w/2,y:a.y+a.h/2}; let best=null,bs=1e9,gap=0;
  for(const el of els){ if(el===from) continue; const b=rectOf(el), bc={x:b.x+b.w/2,y:b.y+b.h/2}; let m,c;
    if(dir==='right'){ if(b.x<a.x+a.w-4) continue; m=b.x-(a.x+a.w); c=oy(a,b)+Math.abs(bc.y-ac.y)*.05;}
    else if(dir==='left'){ if(b.x+b.w>a.x+4) continue; m=a.x-(b.x+b.w); c=oy(a,b)+Math.abs(bc.y-ac.y)*.05;}
    else if(dir==='down'){ if(b.y<a.y+a.h-4) continue; m=b.y-(a.y+a.h); c=ox(a,b)+Math.abs(bc.x-ac.x)*.05;}
    else { if(b.y+b.h>a.y+4) continue; m=a.y-(b.y+b.h); c=ox(a,b)+Math.abs(bc.x-ac.x)*.05;}
    const sc=Math.max(0,m)+c*2; if(sc<bs){bs=sc;best=el;gap=Math.round(m);} }
  return best?{el:best,gap}:null;
}
const hex2=h=>{const m=/^#?([0-9a-f]{6})/i.exec(h||'');if(!m)return[.37,.84,1];const v=parseInt(m[1],16);return[(v>>16&255)/255,(v>>8&255)/255,(v&255)/255];};
let accT=hex2('#E5484D'), acc=accT.slice();
function setFocus(el){
  if(!el) return; if(cur) cur.classList.remove('on'); cur=el; el.classList.add('on'); if(!el.closest('.topbar')) mem[screen]=el.id;
  if(el.dataset.accent) accT=hex2(el.dataset.accent);
  if(el.dataset.act==='fresh') spotFresh(FRESH_IDX[el.dataset.k]);
  const isWin=el.classList.contains('win'), room=$('#room');
  if(room){ room.classList.toggle('lit',isWin);
    if(isWin){ const c=el.dataset.accent, v=parseInt(c.slice(1),16), rgb=`${v>>16&255},${v>>8&255},${v&255}`, i=winIndex(el);
      room.style.background=drive?`radial-gradient(1200px 420px at ${(i+.5)/el.parentNode.children.length*100}% 104%,rgba(${rgb},.18),transparent 75%)`
        :`radial-gradient(1200px 560px at ${12+i*19}% 108%,rgba(${rgb},.42),transparent 70%),radial-gradient(900px 420px at 80% -12%,rgba(${rgb},.16),transparent 70%),linear-gradient(0deg,rgba(${rgb},.10),transparent 60%)`; } }
  cityUp=!!drive&&isWin&&screen==='home'&&perfLevel<1; perf.quietSince=performance.now();
  if(drive) drive.focus(cityUp?winIndex(el):-1);
  if(screen==='home') brightT=isWin?1.05:.78;
}
function nav(dir){ if(!cur){setFocus(list()[0]);return;} const nb=neighbor(cur,dir,list());
  if(nb) setFocus(nb.el);
  else cur.animate([{transform:'translateX(0)'},{transform:`translate${dir==='left'||dir==='right'?'X':'Y'}(${dir==='left'||dir==='up'?-6:6}px)`},{transform:'translateX(0)'}],{duration:180}); }

/* ---------- screens ---------- */
let brightT=.78, bright=.78;
function go(name){
  if(!SCREENS.includes(name)) return;
  // Home (the tab, the remote's Home button, the dial) always lands on the Continue watching strip.
  if(name==='home') mem.home='resume';
  closeDial();
  if(!reduce){ stage.classList.remove('glitch'); void stage.offsetWidth; stage.classList.add('glitch'); setTimeout(()=>stage.classList.remove('glitch'),360);}
  if(name==='apps'&&!APPLIST.length) renderApps();
  if(name==='new') renderFresh();
  screen=name;
  SCREENS.forEach(s=>$('#s-'+s).hidden=s!==name);
  $$('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.v===name));
  brightT={home:.78,resume:.55,new:.8,apps:.5}[name];
  const el=(mem[name]&&document.getElementById(mem[name]))||$$(`#s-${name} [data-f]`)[0]||list()[0];
  if(cur) cur.classList.remove('on'); cur=null; setFocus(el);
}
function splash(pkg,name,color,el,done){ if(reduce){done();return;} const r=rectOf(el), d=document.createElement('div'); d.className='splash';
  d.style.background=`radial-gradient(circle at 50% 45%, ${color}, #050610 80%)`;
  d.style.clipPath=`inset(${r.y}px ${1280-r.x-r.w}px ${720-r.y-r.h}px ${r.x}px round 18px)`; d.innerHTML=`<span>${esc(name)}</span>`; stage.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.clipPath='inset(0px 0px 0px 0px round 0px)';}));
  setTimeout(done,620); setTimeout(()=>d.classList.add('out'),1400); setTimeout(()=>d.remove(),1900); }
function toast(html){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=html; $('#toasts').appendChild(t);
  const all=$$('#toasts .toast'); if(all.length>3) all[0].remove();

/* ---------- the night drive (nightdrive.js) and the weather ---------- */
let drive=null, driveK=0, cityUp=false;

/* Slow TVs: Home measures its own frame pacing for a few calm seconds and lightens up if frames are missed.
   level 0 = everything; 1 = no city behind the dock, the background redraws every third frame;
   2 = also the night drive at the lowest resolution and half rate. Remembered across starts, only ever
   stepping up (perf-v1 in local storage; ck.perf(0) resets it). #perf=N in the URL forces a level. */
const PERF_KEY='perf-v1';
let perfLevel=0; try{ perfLevel=Math.min(2,+localStorage.getItem(PERF_KEY)||0); }catch(e){}
const forced=/perf=(\d)/.exec(location.hash); if(forced) perfLevel=Math.min(2,+forced[1]);
const perf={on:!forced&&perfLevel<2, n:0, slow:0, quietSince:performance.now()+3000};   // skip the first seconds: start-up work
function perfSample(ms){
  if(!perf.on||performance.now()<perf.quietSince+1500) return;    // not while focus moves or a city is being drawn
  perf.n++; if(ms>25) perf.slow++;                                 // a frame is 16.7 ms at 60 Hz, 20 ms at 50 Hz
  if(perf.n<240) return;                                           // about four seconds
  const missed=perf.slow/perf.n; perf.n=perf.slow=0;
  if(missed>.15) setPerf(perfLevel+1); else perf.on=false;         // smooth: stop measuring
}
function setPerf(l){
  const was=perfLevel; perfLevel=Math.max(0,Math.min(2,l)); try{ localStorage.setItem(PERF_KEY,perfLevel); }catch(e){}
  console.warn(`home: performance level ${was} -> ${perfLevel}`);
  if(perfLevel>=1&&drive){ drive.focus(-1); cityUp=false; }
  if((perfLevel>=2)!==(was>=2)) startDrive();
  perf.on=perfLevel<2; perf.n=perf.slow=0; perf.quietSince=performance.now();
}
const driveRes=()=>Math.max(1,Math.min(2,(window.devicePixelRatio||1)*S));
function startDrive(){
  const wins=$$('#dock .win'); drive=null;
  // the road needs three to five windows; with fewer (or on an old WebView) each window gets a plain sky
  if(window.NightDrive&&wins.length>=3&&wins.length<=5){
    try{ driveK=perfLevel>=2?1:driveRes();
      drive=NightDrive.start({apps:wins.map(el=>({c:el.dataset.accent,key:appKey(el.dataset.pkg),canvas:el.querySelector('canvas')})),
        track:$('#track'), trackBg:$('#trackbg'), imm:[$('#immA'),$('#immB')], k:driveK});
      if(cur&&cur.classList.contains('win')) drive.focus(winIndex(cur));
      return; }
    catch(e){ console.error('night drive: '+e); drive=null; } }
  wins.forEach(el=>{ const cv=el.querySelector('canvas'), c=cv.getContext('2d'); cv.width=220; cv.height=150;
    const g=c.createLinearGradient(0,0,0,150); g.addColorStop(0,el.dataset.accent+'38'); g.addColorStop(1,'#070912'); c.fillStyle=g; c.fillRect(0,0,220,150); });

let holdT=null, held=false;

    else if(isOk(e)){ if(!e.repeat&&!held) dialPick(); } else if(k==='Escape') closeDial(); else return;

  if(isOk(e)){ e.preventDefault(); if(e.repeat) return; held=false; clearTimeout(holdT); holdT=setTimeout(()=>{held=true; hold();},450); return; }
  if(k.startsWith('Arrow')){ nav(k.slice(5).toLowerCase()); e.preventDefault(); return; }

});

  clearTimeout(holdT); holdT=null; if(!held&&overlay===null) press(); held=false; });

/* ---------- called by the launcher ---------- */
function refresh(){ fit(); renderHome(); renderShows(); renderStatus(); if(screen==='new') renderFresh(true); if(screen==='apps') renderApps();
  const keep=cur&&document.getElementById(cur.id); if(cur) cur.classList.remove('on'); cur=null;
  setFocus(keep||(mem[screen]&&document.getElementById(mem[screen]))||$$(`#s-${screen} [data-f]`)[0]); }
window.ck={
  refresh, back, go:n=>{quietUntil=performance.now()+700; go(n);},
  freshReady:()=>{ FRESH=parse(()=>CK.fresh(),[]); $('#newDot').hidden=!FRESH.some(c=>c.fresh>0); if(screen==='new') renderFresh(true); },
  visible:v=>{paused=!v; if(v){ quietUntil=performance.now()+700; perf.quietSince=performance.now(); } },
  perf:l=>{ if(l!=null) setPerf(+l); return perfLevel; },
  dial:()=>{ dialSel=0; openDial(); },
  key:k=>{ // dial-only overlay: keys come from DialService
    if(k==='left'||k==='up') dialMove(-1); else if(k==='right'||k==='down') dialMove(1); else if(k==='ok') dialPick(); else if(k==='back') closeDial(); }
};

/* ---------- start ---------- */
fit();
if(DIAL_ONLY){ dialSel=0; openDial(); }
else { refresh(); go('home'); stage.classList.remove('glitch'); tick(); setInterval(tick,1000);
  try{ WX=JSON.parse(localStorage.getItem('wx')||'null'); }catch(e){} if(WX) showWx();
  loadWx(); setInterval(loadWx,15*60*1000); setInterval(()=>{ if(WX) showWx(); },60*1000); }
})();
</script>
</body></html>
