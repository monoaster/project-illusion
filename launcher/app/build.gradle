plugins {
    id 'com.android.application'
}

android {
    namespace 'com.projectillusion.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.projectillusion.home'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Installed over ADB, never published: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Tests only (never in the APK): the Continue watching and New for you rules run on the JVM.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
